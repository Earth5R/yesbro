name: Yes Bro daily

on:
  schedule:
    # Backup only. The 05:00 IST publish is an external workflow_dispatch
    # with no inputs (empty date = today IST). GitHub cron is UTC.
    # 01:00 UTC is 06:30 IST that same morning, after the 05:00 run has
    # normally committed. GitHub may still start this event later.
    # A queued backup checks out origin/main when it starts, then skips
    # if daily/archive/<that IST date>.html is already the published issue.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Paper date YYYY-MM-DD (IST). Empty = today IST."
        required: false
        default: ""
      eds:
        description: "Comma list of papers, or empty for all"
        required: false
        default: ""
      dry_run:
        description: "Set to 1 to skip Gemini and use fallback copy"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: yesbro-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check out latest main for the backup schedule
        if: github.event_name == 'schedule'
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Skip backup schedule when today's Daily is already published
        id: published
        run: sh pipeline/yesbro/skip_published_edition.sh

      - name: Set up Python
        if: steps.published.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        if: steps.published.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          # Builder scripts live under pipeline/yesbro (vendored). Site HTML is repo root.

      - name: Configure paths
        if: steps.published.outputs.skip != 'true'
        run: |
          echo "YESBRO_ROOT=${GITHUB_WORKSPACE}/pipeline/yesbro" >> "$GITHUB_ENV"
          echo "YESBRO_SITE=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/pipeline:${GITHUB_WORKSPACE}/pipeline/yesbro" >> "$GITHUB_ENV"
          mkdir -p pipeline/yesbro/memes pipeline/yesbro/columns pipeline/yesbro/cache

      - name: Run daily pipeline
        if: steps.published.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YESBRO_DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          YESBRO_EDS: ${{ github.event.inputs.eds || '' }}
          YESBRO_GEMINI_MODEL: gemini-3.1-flash-lite
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          EXTRA=()
          if [ -n "$DATE_ARG" ]; then EXTRA+=(--date "$DATE_ARG"); fi
          # Prefer fewer stories per section to stay inside free-tier Gemini limits.
          python pipeline/run_daily.py --per-section 9 "${EXTRA[@]}"

      - name: Commit published pages
        if: steps.published.outputs.skip != 'true'
        run: sh pipeline/yesbro/publish_daily_commit.sh


      - name: Ping IndexNow
        if: success() && steps.published.outputs.skip != 'true'
        run: |
          python pipeline/yesbro/indexnow_ping.py --site "$GITHUB_WORKSPACE"
